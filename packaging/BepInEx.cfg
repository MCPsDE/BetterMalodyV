[Caching]
EnableAssemblyCache = true

[IL2CPP]
UpdateInteropAssemblies = true
UnityBaseLibrariesSource = 2022.3.62.zip
UnhollowerDeobfuscationRegex =
ScanMethodRefs = true
DumpDummyAssemblies = false
IL2CPPInteropAssembliesPath = {BepInEx}
PreloadIL2CPPInteropAssemblies = true
GlobalMetadataPath = {GameDataPath}/il2cpp_data/Metadata/global-metadata.dat

[Logging]
UnityLogListening = true

[Logging.Console]
Enabled = false
PreventClose = false
ShiftJisEncoding = false
StandardOutType = Auto
LogLevels = Fatal, Error, Warning, Message, Info

[Logging.Disk]
AppendLog = false
Enabled = true
LogLevels = Fatal, Error, Warning, Message, Info
InstantFlushing = true
ConcurrentFileLimit = 5
WriteUnityLog = false

[Preloader]
HarmonyBackend = auto
DumpAssemblies = false
LoadDumpedAssemblies = false
BreakBeforeLoadAssemblies = false
